name: Ingest amendments (manual)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start of the period to ingest (YYYY-MM-DD, e.g. 2026-11-01)"
        required: true
        type: string
      end_date:
        description: "End of the period (YYYY-MM-DD, inclusive); empty = today (Europe/Rome)"
        required: false
        type: string
        default: ""
      legislature:
        description: "Senate legislature"
        required: false
        type: string
        default: "19"
      limit:
        description: "Cap of amendments to scan (SPARQL batches of 100; must cover the whole period, max 20000)"
        required: false
        type: string
        default: "5000"

permissions: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE_INPUT: ${{ inputs.end_date }}
      LEGISLATURE: ${{ inputs.legislature }}
      LIMIT: ${{ inputs.limit }}
      WORKFLOW_NAME: emendamenti-giornalieri
      DEPLOYMENT_NAME: emendamentopoli
      API_BASE: https://api.mistral.ai/v1
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ -z "$START_DATE" ]]; then
            echo "start_date is required" >&2
            exit 1
          fi
          for v in START_DATE END_DATE_INPUT; do
            val="${!v}"
            if [[ -n "$val" && ! "$val" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "$v must be in YYYY-MM-DD format (value: $val)" >&2
              exit 1
            fi
          done
          for v in LEGISLATURE LIMIT; do
            if ! [[ "${!v}" =~ ^[0-9]+$ ]]; then
              echo "$v must be an integer" >&2
              exit 1
            fi
          done
          if [[ -z "$MISTRAL_API_KEY" ]]; then
            echo "Missing MISTRAL_API_KEY secret (Settings > Secrets and variables > Actions)" >&2
            exit 1
          fi

      - name: Start workflow execution ${{ env.WORKFLOW_NAME }}
        id: start
        run: |
          set -euo pipefail
          END_DATE="$END_DATE_INPUT"
          if [[ -z "$END_DATE" ]]; then
            END_DATE="$(TZ=Europe/Rome date +%F)"
          fi
          echo "Ingest period: $START_DATE .. $END_DATE (legislature $LEGISLATURE, limit $LIMIT, deployment $DEPLOYMENT_NAME)"
          PAYLOAD="$(jq -n \
            --arg date "$START_DATE" \
            --arg end_date "$END_DATE" \
            --argjson legislature "$LEGISLATURE" \
            --argjson limit "$LIMIT" \
            '{input: {date: $date, end_date: $end_date, legislature: $legislature, limit: $limit}, wait_for_result: false}')"
          RESP="$(curl -sS -X POST "$API_BASE/workflows/$WORKFLOW_NAME/execute" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")"
          echo "$RESP" | jq .
          EXEC_ID="$(echo "$RESP" | jq -r '.execution_id // empty')"
          if [[ -z "$EXEC_ID" ]]; then
            echo "No execution_id in the API response" >&2
            exit 1
          fi
          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"
          echo "Execution started: $EXEC_ID"

      - name: Wait for completion
        run: |
          set -euo pipefail
          EXEC_ID="${{ steps.start.outputs.execution_id }}"
          for _ in $(seq 1 340); do
            RESP="$(curl -sS "$API_BASE/workflows/executions/$EXEC_ID" \
              -H "Authorization: Bearer $MISTRAL_API_KEY")"
            STATUS="$(echo "$RESP" | jq -r '.status')"
            echo "$(date -u +%H:%M:%SZ) status=$STATUS"
            case "$STATUS" in
              COMPLETED)
                echo "$RESP" | jq '{execution_id, status, result}'
                exit 0
                ;;
              FAILED|CANCELED|TERMINATED|TIMED_OUT)
                echo "$RESP" | jq . >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timeout: execution still not finished after ~170 minutes" >&2
          exit 1
