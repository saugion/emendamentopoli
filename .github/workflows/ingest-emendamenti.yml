name: Ingest emendamenti (manuale)

on:
  workflow_dispatch:
    inputs:
      data_inizio:
        description: "Inizio del periodo da ingerire (YYYY-MM-DD, es. 2026-11-01)"
        required: true
        type: string
      data_fine:
        description: "Fine del periodo (YYYY-MM-DD, inclusivo); vuoto = oggi (Europe/Rome)"
        required: false
        type: string
        default: ""
      legislatura:
        description: "Legislatura del Senato"
        required: false
        type: string
        default: "19"
      limite:
        description: "Emendamenti recenti da scandire al massimo (deve coprire tutto il periodo; max 20000)"
        required: false
        type: string
        default: "20000"

permissions: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      DATA_INIZIO: ${{ inputs.data_inizio }}
      DATA_FINE_INPUT: ${{ inputs.data_fine }}
      LEGISLATURA: ${{ inputs.legislatura }}
      LIMITE: ${{ inputs.limite }}
      WORKFLOW_NAME: emendamenti-giornalieri
      DEPLOYMENT_NAME: emendamentopoli
      API_BASE: https://api.mistral.ai/v1
    steps:
      - name: Valida gli input
        run: |
          set -euo pipefail
          if [[ -z "$DATA_INIZIO" ]]; then
            echo "data_inizio è obbligatoria" >&2
            exit 1
          fi
          for v in DATA_INIZIO DATA_FINE_INPUT; do
            val="${!v}"
            if [[ -n "$val" && ! "$val" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "$v deve essere nel formato YYYY-MM-DD (valore: $val)" >&2
              exit 1
            fi
          done
          for v in LEGISLATURA LIMITE; do
            if ! [[ "${!v}" =~ ^[0-9]+$ ]]; then
              echo "$v deve essere un numero intero" >&2
              exit 1
            fi
          done
          if [[ -z "$MISTRAL_API_KEY" ]]; then
            echo "Secret MISTRAL_API_KEY mancante (Settings > Secrets and variables > Actions)" >&2
            exit 1
          fi

      - name: Avvia l'esecuzione del workflow ${{ env.WORKFLOW_NAME }}
        id: start
        run: |
          set -euo pipefail
          DATA_FINE="$DATA_FINE_INPUT"
          if [[ -z "$DATA_FINE" ]]; then
            DATA_FINE="$(TZ=Europe/Rome date +%F)"
          fi
          echo "Periodo ingest: $DATA_INIZIO .. $DATA_FINE (legislatura $LEGISLATURA, limite $LIMITE, deployment $DEPLOYMENT_NAME)"
          PAYLOAD="$(jq -n \
            --arg data "$DATA_INIZIO" \
            --arg fine "$DATA_FINE" \
            --argjson legislatura "$LEGISLATURA" \
            --argjson limite "$LIMITE" \
            '{input: {data: $data, data_fine: $fine, legislatura: $legislatura, limite: $limite}, wait_for_result: false}')"
          RESP="$(curl -sS -X POST "$API_BASE/workflows/$WORKFLOW_NAME/execute" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")"
          echo "$RESP" | jq .
          EXEC_ID="$(echo "$RESP" | jq -r '.execution_id // empty')"
          if [[ -z "$EXEC_ID" ]]; then
            echo "Nessuna execution_id nella risposta dell'API" >&2
            exit 1
          fi
          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"
          echo "Esecuzione avviata: $EXEC_ID"

      - name: Attendi il completamento
        run: |
          set -euo pipefail
          EXEC_ID="${{ steps.start.outputs.execution_id }}"
          for _ in $(seq 1 340); do
            RESP="$(curl -sS "$API_BASE/workflows/executions/$EXEC_ID" \
              -H "Authorization: Bearer $MISTRAL_API_KEY")"
            STATUS="$(echo "$RESP" | jq -r '.status')"
            echo "$(date -u +%H:%M:%SZ) status=$STATUS"
            case "$STATUS" in
              COMPLETED)
                echo "$RESP" | jq '{execution_id, status, result}'
                exit 0
                ;;
              FAILED|CANCELED|TERMINATED|TIMED_OUT)
                echo "$RESP" | jq . >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timeout: esecuzione ancora non conclusa dopo ~170 minuti" >&2
          exit 1
